<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Forever Proposal</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #fff7ff;
            background: radial-gradient(circle at top, #2b003b 0%, #090111 55%, #020104 100%);
           text-align: center;
        }

        #instruction {
            position: fixed;
            top: 34px;
            left: 0;
            right: 0;
            z-index: 5;
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.78);
        }

        .proposal-card {
            position: relative;
            width: 90%;
            max-width: 720px;
            padding: 36px 28px 42px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            overflow: hidden;
        }

        .card-kicker {
            display: table;
            margin: 0 auto 10px;
            padding: 7px 13px;
            border: 1px solid rgba(255, 222, 232, 0.2);
            border-radius: 999px;
            color: #ffe2ed;
            background: rgba(255, 255, 255, 0.06);
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .proposal-card::before {
            content: "";
            position: absolute;
            inset: -40%;
            background:
                radial-gradient(circle, rgba(255, 255, 255, 0.38) 0 2px, transparent 3px),
                radial-gradient(circle, rgba(255, 209, 102, 0.32) 0 2px, transparent 4px);
            background-size: 90px 90px, 130px 130px;
            opacity: 0.28;
            animation: softStars 9s linear infinite;
            pointer-events: none;
        }

        .proposal-card > * {
            position: relative;
            z-index: 1;
        }

        body.active .proposal-card {
            opacity: 1;
            transform: translateY(0);
        }

        body.final-mode .proposal-card {
            opacity: 0;
            transform: translateY(-28px) scale(0.96);
            pointer-events: none;
        }

        body.active #instruction {
            display: none;
        }

        .heart-stage {
            width: 150px;
            height: 140px;
            margin: 0 auto 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .heart {
            width: 100px;
            height: 100px;
            background: #e60023;
            position: relative;
            transform: rotate(-45deg);
            border-radius: 16px;
            animation: heartPulse 1.25s ease-in-out infinite;
        }

        .heart::before,
        .heart::after {
            content: "";
            width: 100px;
            height: 100px;
            background: #e60023;
            border-radius: 50%;
            position: absolute;
        }

        .heart::before {
            top: -50px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 50px;
        }

        h1 {
            margin: 0 0 12px;
            font-family: "Segoe Script", "Brush Script MT", cursive;
            font-size: clamp(2.2rem, 6vw, 3.4rem);
            font-style: italic;
            color: #ffe8f8;
            text-shadow: 0 0 20px rgba(255, 79, 163, 0.55);
        }

        h2 {
            margin: 0 0 18px;
            font-size: clamp(1.15rem, 3vw, 1.55rem);
            color: #ffdce9;
        }

        p {
            max-width: 560px;
            margin: 0 auto 22px;
            font-size: 18px;
            line-height: 1.7;
        }

        .final-line {
            font-size: 28px;
            font-weight: bold;
            color: #ffd166;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .line {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.7s ease, transform 0.7s ease;
            min-height: 1.4em;
        }

        .line.show {
            opacity: 1;
            transform: translateY(0);
            text-shadow: 0 0 18px rgba(255, 111, 174, 0.35);
        }

        .line.typing::after {
            content: "|";
            display: inline-block;
            margin-left: 4px;
            color: #ffd166;
            animation: cursorBlink 0.8s step-end infinite;
        }

        .effect-emoji {
            position: fixed;
            z-index: 4;
            bottom: -40px;
            font-size: 24px;
            opacity: 0;
            pointer-events: none;
            animation: emojiFloat 6s ease-in forwards;
        }

        .final-page {
            position: fixed;
            inset: 0;
            z-index: 20;
            overflow: hidden;
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 48%, rgba(255, 70, 110, 0.18), transparent 35%),
                linear-gradient(180deg, #0b1f39 0%, #160b27 58%, #080008 100%);
            transition: opacity 1.4s ease, transform 1.8s ease;
        }

        .memory-photo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            opacity: 0;
            transform: scale(1.08);
            filter: saturate(1.12) contrast(1.04);
            transition: opacity 1.8s ease, transform 9s ease;
        }

        .final-page.show .memory-photo {
            opacity: 0.88;
            transform: scale(1);
        }

        .photo-shade {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(3, 8, 22, 0.2), rgba(18, 2, 20, 0.52)),
                radial-gradient(circle at center, transparent 20%, rgba(2, 0, 12, 0.52) 100%);
            pointer-events: none;
        }

        .final-page.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .photo-picker {
            position: absolute;
            left: 50%;
            bottom: 28px;
            z-index: 6;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .photo-picker button {
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 999px;
            padding: 10px 16px;
            color: #fff;
            background: rgba(20, 8, 30, 0.62);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
            cursor: pointer;
            font: inherit;
            transition: background 0.25s ease, transform 0.25s ease;
        }

        .photo-picker button:hover {
            background: rgba(230, 0, 35, 0.72);
            transform: translateY(-2px);
        }

        .light-curtain {
            position: absolute;
            inset: 0;
            z-index: 2;
            opacity: 0.46;
            background-image:
                linear-gradient(90deg, transparent 0 8%, rgba(255, 220, 145, 0.2) 8.3%, transparent 8.7%),
                radial-gradient(circle, rgba(255, 244, 201, 0.8) 0 2px, transparent 3px);
            background-size: 112px 100%, 112px 72px;
            background-position: 0 0, 0 18px;
            animation: lightsSlow 7s ease-in-out infinite;
        }

        .balloon {
            position: absolute;
            z-index: 3;
            width: 110px;
            height: 110px;
            color: #e60023;
            font-size: 92px;
            line-height: 110px;
            text-align: center;
            text-shadow: 0 0 28px rgba(255, 42, 70, 0.65);
            animation: balloonFloat 4.5s ease-in-out infinite;
        }

        .balloon::before {
            content: none;
        }

        .balloon-heart {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0 0 24px rgba(255, 42, 70, 0.65));
        }

        .balloon .string {
            position: absolute;
            left: 54px;
            top: 92px;
            width: 2px;
            height: 150px;
            background: rgba(255, 140, 150, 0.8);
            transform-origin: top;
        }

        .balloon.big {
            left: 50%;
            top: 13%;
            transform: translateX(-50%) scale(1.15);
        }

        .balloon.left {
            left: 16%;
            top: 22%;
            transform: scale(0.72);
            animation-delay: 0.7s;
        }

        .balloon.right {
            right: 16%;
            top: 23%;
            transform: scale(0.78);
            animation-delay: 1.2s;
        }

        .slow-love {
            position: absolute;
            z-index: 4;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            margin: 0;
            padding: 0 12px;
            font-family: "Brush Script MT", "Segoe Script", cursive;
            font-style: italic;
            font-size: clamp(1rem, 7vw, 6rem);
            font-weight: 700;
            line-height: 1;
            color: #fff1f7;
            letter-spacing: 0;
            white-space: nowrap;
            text-shadow:
                0 0 12px rgba(255, 255, 255, 0.95),
                0 0 35px rgba(255, 55, 95, 0.95),
                0 0 80px rgba(255, 0, 48, 0.65);
            opacity: 0;
            filter: blur(12px);
            animation: slowLoveReveal 4.8s ease forwards;
        }

        .slow-love span {
            display: inline-block;
            opacity: 0;
            transform: translateY(34px) scale(0.9);
            animation: letterIn 1.2s ease forwards;
        }

        .slow-love span:nth-child(2),
        .slow-love span:nth-child(7) {
            width: 0.16em;
        }

        .final-caption {
            position: absolute;
            z-index: 4;
            top: 65%;
            left: 50%;
            width: calc(100% - 32px);
            margin: 0;
            color: rgba(255, 242, 248, 0.94);
            font-size: clamp(0.7rem, 2vw, 0.96rem);
            font-weight: 600;
            letter-spacing: 0.24em;
            text-align: center;
            text-shadow: 0 2px 14px rgba(28, 2, 20, 0.85);
            transform: translateX(-50%);
        }

        .slow-love span:nth-child(1) { animation-delay: 0.4s; }
        .slow-love span:nth-child(2) { animation-delay: 0.7s; }
        .slow-love span:nth-child(3) { animation-delay: 1.0s; }
        .slow-love span:nth-child(4) { animation-delay: 1.3s; }
        .slow-love span:nth-child(5) { animation-delay: 1.6s; }
        .slow-love span:nth-child(6) { animation-delay: 1.9s; }
        .slow-love span:nth-child(7) { animation-delay: 2.2s; }
        .slow-love span:nth-child(8) { animation-delay: 2.5s; }

        @keyframes heartPulse {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 10px 16px rgba(190, 18, 54, 0.32));
            }

            50% {
                transform: scale(1.08);
                filter: drop-shadow(0 12px 25px rgba(238, 35, 72, 0.58));
            }
        }

        @keyframes heartGleam {
            0%, 100% { opacity: 0.78; }
            50% { opacity: 1; }
        }

        @keyframes heartTwinkle {
            0%, 100% { opacity: 0.48; transform: scale(0.82) rotate(-12deg); }
            50% { opacity: 1; transform: scale(1.12) rotate(8deg); }
        }

        @keyframes lightsSlow {
            0%, 100% {
                opacity: 0.72;
                filter: brightness(0.92);
            }

            50% {
                opacity: 1;
                filter: brightness(1.3);
            }
        }

        @keyframes balloonFloat {
            0%, 100% {
                margin-top: 0;
            }

            50% {
                margin-top: -18px;
            }
        }

        @keyframes slowLoveReveal {
            to {
                opacity: 1;
                filter: blur(0);
            }
        }

        @keyframes letterIn {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes cursorBlink {
            0%, 50% {
                opacity: 1;
            }

            51%, 100% {
                opacity: 0;
            }
        }

        @keyframes softStars {
            from {
                transform: translate3d(0, 0, 0) rotate(0deg);
            }

            to {
                transform: translate3d(70px, -70px, 0) rotate(8deg);
            }
        }

        @keyframes emojiFloat {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.7) rotate(0deg);
            }

            15% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translateY(-110vh) scale(1.25) rotate(18deg);
            }
        }

        @media (max-width: 700px) {
            .balloon.left {
                left: 8%;
            }

            .balloon.right {
                right: 8%;
            }
        }

        :root {
            --romance-red: #e60023;
            --romance-pink: #ff5b9d;
            --romance-gold: #ffd166;
            --pointer-x: 50%;
            --pointer-y: 50%;
        }

        html {
            background: #020104;
        }

        body {
            background:
                radial-gradient(circle at var(--pointer-x) var(--pointer-y), rgba(255, 76, 148, 0.18), transparent 25%),
                radial-gradient(circle at 20% 20%, rgba(104, 26, 122, 0.6), transparent 34%),
                radial-gradient(circle at 80% 85%, rgba(135, 12, 48, 0.42), transparent 30%),
                #050109;
            transition: background 0.35s ease;
        }

        body::before,
        body::after {
            position: fixed;
            inset: 0;
            content: "";
            pointer-events: none;
        }

        body::before {
            z-index: -1;
            opacity: 0.28;
            background-image: radial-gradient(rgba(255, 255, 255, 0.7) 1px, transparent 1px);
            background-size: 92px 92px;
            animation: drift 24s linear infinite;
        }

        body::after {
            z-index: 30;
            opacity: 0;
            background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.4));
            transition: opacity 1.5s ease;
        }

        body.final-mode::after {
            opacity: 1;
        }

        .proposal-card {
            backdrop-filter: blur(16px) saturate(1.25);
            -webkit-backdrop-filter: blur(16px) saturate(1.25);
        }

        .proposal-card::after {
            position: absolute;
            inset: 1px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 23px;
            content: "";
            pointer-events: none;
        }

        .final-page {
            background-color: #120316;
        }

        .memory-photo {
            object-position: center center;
        }

        .final-page.show .memory-photo {
            animation: memoryZoom 12s ease-out forwards;
        }

        .photo-shade {
            background:
                linear-gradient(180deg, rgba(3, 8, 22, 0.12), rgba(18, 2, 20, 0.62)),
                linear-gradient(90deg, rgba(4, 0, 13, 0.28), transparent 45%, rgba(4, 0, 13, 0.24)),
                radial-gradient(circle at center, transparent 18%, rgba(2, 0, 12, 0.62) 100%);
        }

        .photo-picker button {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            letter-spacing: 0.04em;
        }

        .photo-picker button:focus-visible {
            outline: 2px solid var(--romance-gold);
            outline-offset: 4px;
        }

        .spark {
            position: fixed;
            z-index: 50;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--romance-gold);
            box-shadow: 0 0 14px var(--romance-pink);
            pointer-events: none;
            animation: sparkFly 0.85s ease-out forwards;
        }

        @keyframes drift {
            to { transform: translate3d(46px, -46px, 0); }
        }

        @keyframes memoryZoom {
            from { transform: scale(1.08); }
            to { transform: scale(1.02); }
        }

        @keyframes sparkFly {
            to {
                opacity: 0;
                transform: translate(var(--spark-x), var(--spark-y)) scale(0.1) rotate(180deg);
            }
        }

        @media (max-width: 700px) {
            #instruction {
                top: 22px;
                padding: 0 18px;
                font-size: 12px;
                letter-spacing: 2px;
            }

            .proposal-card {
                width: calc(100% - 28px);
                padding: 28px 20px 32px;
                border-radius: 20px;
            }

            .heart-stage {
                transform: scale(0.78);
                margin-bottom: 8px;
            }

            p {
                font-size: 16px;
            }

            .slow-love {
                font-size: clamp(3.8rem, 18vw, 7rem);
            }

            .balloon.left {
                left: 1%;
                top: 17%;
            }

            .balloon.right {
                right: 1%;
                top: 18%;
            }

            .photo-picker {
                bottom: 18px;
                width: 100%;
                justify-content: center;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 700px), (max-height: 650px) {
            body {
                min-height: 100svh;
                height: auto;
                overflow-x: hidden;
                overflow-y: auto;
                padding: 72px 0 84px;
                align-items: flex-start;
            }

            .proposal-card {
                margin-block: auto;
            }

        }

        :root {
            color-scheme: dark;
            --page-gutter: clamp(16px, 4vw, 32px);
        }

        .svg-defs {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
        }

        html {
            width: 100%;
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            position: relative;
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            min-height: 100dvh;
            height: auto;
            overflow-x: clip;
            overflow-y: auto;
            padding: max(76px, env(safe-area-inset-top)) 0 max(88px, env(safe-area-inset-bottom));
            align-items: center;
        }

        #instruction {
            top: max(18px, env(safe-area-inset-top));
            left: var(--page-gutter);
            right: auto;
            max-width: calc(100% - 2 * var(--page-gutter));
            min-height: 44px;
            padding: 10px 16px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            color: rgba(255, 255, 255, 0.88);
            background: rgba(21, 7, 28, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            font: inherit;
            font-size: 0.76rem;
            letter-spacing: 0.12em;
            cursor: pointer;
        }

        #instruction:focus-visible,
        .photo-picker button:focus-visible {
            outline: 2px solid var(--romance-gold);
            outline-offset: 4px;
        }

        .proposal-card {
            width: min(calc(100% - 2 * var(--page-gutter)), 760px);
            max-width: 760px;
            margin: auto;
            padding: clamp(28px, 5vw, 48px) clamp(20px, 6vw, 64px);
            border-radius: clamp(20px, 4vw, 30px);
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.13), rgba(56, 10, 48, 0.36));
            box-shadow: 0 28px 90px rgba(0, 0, 0, 0.5), 0 0 60px rgba(255, 59, 135, 0.1);
        }

        .heart-stage {
            position: relative;
            width: 176px;
            height: 162px;
            margin-bottom: 18px;
        }

        .heart-stage::before,
        .heart-stage::after {
            position: absolute;
            z-index: 1;
            color: #fff0f8;
            font-family: Georgia, serif;
            line-height: 1;
            text-shadow: 0 0 12px rgba(255, 205, 229, 0.9);
            pointer-events: none;
            animation: heartTwinkle 2.8s ease-in-out infinite;
        }

        .heart-stage::before {
            top: 22%;
            left: 3%;
            content: "✧";
            font-size: 24px;
        }

        .heart-stage::after {
            top: 55%;
            right: 2%;
            content: "✦";
            font-size: 17px;
            animation-delay: 0.7s;
        }

        .heart {
            display: block;
            width: clamp(120px, 34vw, 156px);
            height: clamp(120px, 34vw, 156px);
            position: relative;
            z-index: 0;
            overflow: visible;
            background: none;
            border: 0;
            border-radius: 0;
            transform: none;
            filter: drop-shadow(0 10px 12px rgba(185, 0, 38, 0.34))
                drop-shadow(0 0 22px rgba(255, 39, 78, 0.42))
                drop-shadow(0 0 42px rgba(220, 18, 59, 0.22));
            animation: heartPulse 1.8s ease-in-out infinite;
        }

        .heart::before,
        .heart::after {
            content: none;
        }

        .heart > use:first-child,
        .balloon-heart > use:first-child {
            fill: url("#heartGradient");
        }

        .heart > use:nth-child(2),
        .balloon-heart > use:nth-child(2) {
            fill: url("#heartShine");
            pointer-events: none;
        }

        .heart > use:nth-child(2) {
            animation: heartGleam 2.8s ease-in-out infinite;
        }

        .heart-stage:active .heart {
            animation-duration: 0.55s;
        }

        h1 {
            line-height: 1.18;
        }

        h2 {
            line-height: 1.45;
        }

        p {
            font-size: clamp(1rem, 2.2vw, 1.12rem);
            line-height: 1.8;
        }

        .final-line {
            margin-top: 8px;
            font-size: clamp(1.2rem, 4.5vw, 1.8rem);
            line-height: 1.4;
            letter-spacing: 0.08em;
        }

        .final-page {
            min-height: 100vh;
            min-height: 100svh;
            min-height: 100dvh;
            isolation: isolate;
            visibility: hidden;
            transition: opacity 1.4s ease, transform 1.8s ease, visibility 0s linear 1.4s;
            background:
                radial-gradient(ellipse at 50% 35%, rgba(116, 22, 75, 0.4), transparent 55%),
                linear-gradient(160deg, #1d0928, #090511 72%);
        }

        .final-page.show {
            visibility: visible;
            transition-delay: 0s;
        }

        .memory-photo {
            object-position: center;
        }

        .photo-shade {
            z-index: 1;
        }

        .light-curtain {
            z-index: 2;
            pointer-events: none;
        }

        .balloon {
            z-index: 3;
        }

        .slow-love {
            z-index: 4;
            width: 100%;
            padding: 0 8px;
            font-family: "Segoe Script", "Brush Script MT", cursive;
            font-size: clamp(1rem, 7vw, 6rem);
            letter-spacing: 0;
            overflow-wrap: anywhere;
            animation: none;
        }

        .slow-love span {
            animation: none;
        }

        .final-page.show .slow-love {
            animation: slowLoveReveal 1.8s ease both;
        }

        .final-page.show .slow-love span {
            animation: letterIn 0.8s ease both;
        }

        .photo-picker {
            bottom: max(28px, calc(env(safe-area-inset-bottom) + 12px));
            z-index: 8;
            width: min(100% - 24px, 520px);
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            padding: 0 8px;
        }

        .photo-picker button {
            min-height: 46px;
            padding: 11px 18px;
            border-color: rgba(255, 255, 255, 0.42);
            background: rgba(20, 8, 30, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            font-size: 0.94rem;
        }

        .effect-emoji {
            z-index: 10;
        }

        .music-status {
            position: fixed;
            right: max(14px, env(safe-area-inset-right));
            bottom: max(14px, env(safe-area-inset-bottom));
            z-index: 60;
            max-width: min(360px, calc(100vw - 28px));
            padding: 9px 13px;
            border: 1px solid rgba(255, 220, 232, 0.24);
            border-radius: 999px;
            color: #fff3f8;
            background: rgba(25, 7, 24, 0.82);
            box-shadow: 0 8px 26px rgba(0, 0, 0, 0.32);
            font-size: 0.78rem;
            text-align: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .music-status:empty {
            display: none;
        }

        @media (max-width: 560px) {
            #instruction {
                top: max(12px, env(safe-area-inset-top));
                left: 12px;
                max-width: calc(100% - 24px);
                font-size: 0.66rem;
                letter-spacing: 0.08em;
            }

            body {
                padding-top: max(76px, calc(env(safe-area-inset-top) + 60px));
                padding-bottom: max(78px, calc(env(safe-area-inset-bottom) + 60px));
            }

            .proposal-card {
                width: calc(100% - 24px);
                padding: 26px 20px 30px;
            }

            .heart-stage {
                width: 158px;
                height: 144px;
                margin-bottom: 8px;
                transform: none;
            }

            .heart {
                width: clamp(116px, 36vw, 144px);
                height: clamp(116px, 36vw, 144px);
            }

            .photo-picker {
                bottom: max(28px, calc(env(safe-area-inset-bottom) + 12px));
                width: calc(100% - 16px);
                gap: 8px;
            }

            .photo-picker button {
                min-height: 44px;
                padding: 10px 14px;
                font-size: 0.86rem;
            }

            .balloon {
                transform: scale(0.58);
            }

            .balloon-heart {
                width: 100%;
                height: 100%;
                overflow: visible;
                filter: drop-shadow(0 0 18px rgba(255, 42, 105, 0.62));
            }

            .balloon.big {
                top: 8%;
            }

            .balloon.left,
            .balloon.right {
                top: 17%;
            }
        }

        @media (max-width: 360px) {
            .photo-picker {
                gap: 6px;
            }

            .photo-picker button {
                min-height: 42px;
                padding-inline: 10px;
                font-size: 0.78rem;
            }

        }

        @media (max-height: 560px) and (orientation: landscape) {
            body {
                padding-top: max(68px, env(safe-area-inset-top));
                padding-bottom: max(70px, env(safe-area-inset-bottom));
            }

            .proposal-card {
                padding-block: 20px;
            }

            .heart-stage {
                height: 96px;
                transform: scale(0.68);
                margin-bottom: 0;
            }

            .balloon {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .heart,
            .final-page.show .slow-love,
            .final-page.show .slow-love span {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <svg class="svg-defs" aria-hidden="true" focusable="false">
        <defs>
            <linearGradient id="heartGradient" x1="20%" y1="5%" x2="80%" y2="100%">
                <stop offset="0%" stop-color="#fff6f6"></stop>
                <stop offset="18%" stop-color="#ff9aa7"></stop>
                <stop offset="42%" stop-color="#ff2345"></stop>
                <stop offset="74%" stop-color="#ed002f"></stop>
                <stop offset="100%" stop-color="#ad0025"></stop>
            </linearGradient>
            <linearGradient id="heartShine" x1="0%" y1="0%" x2="85%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.94"></stop>
                <stop offset="45%" stop-color="#ffffff" stop-opacity="0.34"></stop>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
            </linearGradient>
            <symbol id="heart-shape" viewBox="0 0 100 100">
                <path d="M50 92C42 84 6 59 6 32 6 15 18 5 33 5c8 0 14 5 17 13C54 10 60 5 68 5c15 0 26 10 26 27 0 27-36 52-44 60Z"></path>
            </symbol>
            <symbol id="heart-gloss" viewBox="0 0 100 100">
                <path d="M14 30C15 16 24 11 34 12c5 1 8 4 11 9-10-4-18 1-19 12-1 9 2 17 7 24-12-5-20-15-19-27Z"></path>
                <path d="M50 21c4-7 10-10 17-9-5 3-9 7-12 13-1 2-4 0-5-4Z"></path>
            </symbol>
        </defs>
    </svg>
    <audio id="backgroundMusic" loop preload="none">
        <source src="./love-song.mp3" type="audio/mpeg">
    </audio>
    <button id="instruction" type="button">Tap or click anywhere to begin</button>
    <span class="music-status" id="musicStatus" role="status" aria-live="polite"></span>

    <main class="proposal-card">
        <div class="card-kicker">A little note from my heart</div>
        <div class="heart-stage">
            <svg class="heart" viewBox="0 0 100 100" role="img" aria-label="Red heart" focusable="false">
                <use href="#heart-shape"></use>
                <use href="#heart-gloss"></use>
            </svg>
        </div>
        <h1 class="line" data-text="Taniya, ❤️"></h1>
        <h2 class="line" data-text="you make every ordinary moment glow ✨"></h2>
        <p class="line" data-text="From the day you came into my life, every smile felt softer, every dream felt closer, and every heartbeat started whispering your name 💫"></p>
        <p class="line" data-text=" I just need your hand in mine, your laugh beside me, and your love forever 🌹"></p>
        <div class="line final-line" data-text="Will you be my forever? 💍"></div>
    </main>

    <section class="final-page" id="finalPage" aria-label="A message of love" aria-hidden="true" inert>
        <img class="memory-photo" id="memoryPhoto" src="WhatsApp Image 2026-09-14 at 09.06.27.jpeg" alt="A beautiful proposal memory">
        <div class="photo-shade"></div>
        <div class="light-curtain"></div>

        <div class="balloon big"><svg class="balloon-heart" viewBox="0 0 100 100" aria-hidden="true"><use href="#heart-shape"></use><use href="#heart-gloss"></use></svg><div class="string"></div></div>
        <div class="balloon left"><svg class="balloon-heart" viewBox="0 0 100 100" aria-hidden="true"><use href="#heart-shape"></use><use href="#heart-gloss"></use></svg><div class="string"></div></div>
        <div class="balloon right"><svg class="balloon-heart" viewBox="0 0 100 100" aria-hidden="true"><use href="#heart-shape"></use><use href="#heart-gloss"></use></svg><div class="string"></div></div>

        <h1 class="slow-love" aria-label="I LOVE YOU">
            <span>I</span>
            <span>&nbsp;</span>
            <span>L</span>
            <span>O</span>
            <span>V</span>
            <span>E</span>
            <span>&nbsp;</span>
            <span>YOU</span>
        </h1>
        <p class="final-caption">MY FAVORITE PERSON, FOREVER</p>

        <div class="photo-picker">
            <button id="replayButton" type="button">Replay</button>
        </div>
    </section>

    <script>
        var activated = false;
        var lines = document.querySelectorAll(".line");
        var finalPage = document.getElementById("finalPage");
        var memoryPhoto = document.getElementById("memoryPhoto");
        var replayButton = document.getElementById("replayButton");
        var backgroundMusic = document.getElementById("backgroundMusic");
        var musicStatus = document.getElementById("musicStatus");
        var emojiTimer;
        var typingTimer;
        var sequenceTimers = [];

        function schedule(callback, delay) {
            var timer = setTimeout(function () {
                sequenceTimers = sequenceTimers.filter(function (scheduledTimer) {
                    return scheduledTimer !== timer;
                });
                callback();
            }, delay);

            sequenceTimers.push(timer);
            return timer;
        }

        function clearSequence() {
            sequenceTimers.forEach(clearTimeout);
            sequenceTimers = [];
            clearInterval(typingTimer);
            typingTimer = null;
        }

        function startBackgroundMusic() {
            backgroundMusic.play().then(function () {
                musicStatus.textContent = "";
            }).catch(function () {
                musicStatus.textContent = "Tap or click anywhere to start the song";
            });
        }

        backgroundMusic.addEventListener("error", function () {
            musicStatus.textContent = "The song file could not be loaded. Keep the MP3 beside PFMF.html.";
        });

        backgroundMusic.addEventListener("play", function () {
            musicStatus.textContent = "";
        });

        memoryPhoto.addEventListener("error", function () {
            memoryPhoto.removeAttribute("src");
            memoryPhoto.style.opacity = "0";
        });

        replayButton.addEventListener("click", function (event) {
            event.stopPropagation();
            clearSequence();
            stopEmojiEffects();
            document.querySelectorAll(".effect-emoji").forEach(function (emoji) {
                emoji.remove();
            });
            document.body.classList.remove("final-mode", "active");
            finalPage.classList.remove("show");
            finalPage.setAttribute("aria-hidden", "true");
            finalPage.setAttribute("inert", "");
            activated = false;
            lines.forEach(function (line) {
                line.classList.remove("show", "typing");
                line.textContent = "";
            });
            schedule(revealProposal, 250);
        });

        function startEmojiEffects() {
            var emojis = ["❤️", "✨", "🌹", "💖", "💫", "💕"];

            emojiTimer = setInterval(function () {
                if (document.querySelectorAll(".effect-emoji").length >= 8) {
                    return;
                }

                var emoji = document.createElement("span");
                emoji.className = "effect-emoji";
                emoji.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                emoji.style.left = Math.random() * 92 + "vw";
                emoji.style.animationDuration = 4.5 + Math.random() * 2.5 + "s";
                emoji.style.fontSize = 18 + Math.random() * 18 + "px";
                document.body.appendChild(emoji);

                schedule(function () {
                    emoji.remove();
                }, 7200);
            }, 1050);
        }

        function stopEmojiEffects() {
            clearInterval(emojiTimer);
        }

        function typeLine(line, speed, done) {
            var characters = Array.from(line.getAttribute("data-text") || "");
            var index = 0;

            line.textContent = "";
            line.classList.add("show", "typing");

            typingTimer = setInterval(function () {
                line.textContent += characters[index];
                index += 1;

                if (index >= characters.length) {
                    clearInterval(typingTimer);
                    typingTimer = null;
                    line.classList.remove("typing");

                    if (done) {
                        schedule(done, 350);
                    }
                }
            }, speed);
        }

        function typeAllLines() {
            typeLine(lines[0], 150, function () {
                typeLine(lines[1], 85, function () {
                    typeLine(lines[2], 48, function () {
                        typeLine(lines[3], 48, function () {
                            typeLine(lines[4], 90, function () {
                                schedule(function () {
                                    document.body.classList.add("final-mode");
                                    stopEmojiEffects();
                                }, 1800);

                                schedule(function () {
                                    finalPage.classList.add("show");
                                    finalPage.removeAttribute("inert");
                                    finalPage.setAttribute("aria-hidden", "false");
                                }, 2600);
                            });
                        });
                    });
                });
            });
        }

        function revealProposal() {
            if (activated) {
                return;
            }

            activated = true;
            startBackgroundMusic();
            document.body.classList.add("active");
            startEmojiEffects();
            schedule(typeAllLines, 350);
        }
       

        document.addEventListener("click", function (event) {
            if (!event.target.closest(".photo-picker")) {
                revealProposal();
            }
        });
        document.addEventListener("keydown", function (event) {
            if (event.key !== "Enter" && event.key !== " ") {
                return;
            }

            if (event.target.closest("button, input, label, audio, a, select, textarea")) {
                return;
            }

            revealProposal();
        });

    </script>
    <script>
        (function () {
            var card = document.querySelector(".proposal-card");
            var heart = document.querySelector(".heart");
            var finalPage = document.getElementById("finalPage");
            var reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            var finePointer = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

            if (!card || reducedMotion || !finePointer) {
                return;
            }

            document.addEventListener("pointermove", function (event) {
                var x = event.clientX / window.innerWidth;
                var y = event.clientY / window.innerHeight;
                var rotateY = (x - 0.5) * 2;
                var rotateX = (0.5 - y) * 2;

                document.documentElement.style.setProperty("--pointer-x", (x * 100).toFixed(1) + "%");
                document.documentElement.style.setProperty("--pointer-y", (y * 100).toFixed(1) + "%");

                if (!finalPage.classList.contains("show")) {
                    card.style.transform = "translateY(0) perspective(900px) rotateX(" + rotateX.toFixed(2) + "deg) rotateY(" + rotateY.toFixed(2) + "deg)";
                }
            });

            document.addEventListener("pointerleave", function () {
                card.style.transform = "";
            });

            document.addEventListener("click", function (event) {
                createBurst(event.clientX, event.clientY);
            });

            heart.addEventListener("pointerdown", function () {
                heart.style.setProperty("animation-duration", "0.55s");
                setTimeout(function () {
                    heart.style.removeProperty("animation-duration");
                }, 700);
            });

            function createBurst(x, y) {
                for (var index = 0; index < 12; index += 1) {
                    var spark = document.createElement("span");
                    var angle = (Math.PI * 2 * index) / 12;
                    var distance = 35 + Math.random() * 55;

                    spark.className = "spark";
                    spark.style.left = x + "px";
                    spark.style.top = y + "px";
                    spark.style.setProperty("--spark-x", Math.cos(angle) * distance + "px");
                    spark.style.setProperty("--spark-y", Math.sin(angle) * distance + "px");
                    document.body.appendChild(spark);
                    setTimeout(function (particle) {
                        particle.remove();
                    }, 850, spark);
                }
            }
        })();
    </script>
</body>
</html>
